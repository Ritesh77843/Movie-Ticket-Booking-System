<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#302b63;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#24243e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E50914;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#E50914;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#E50914;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <!-- Particle effects -->
  <circle cx="100" cy="80" r="3" fill="#E50914" opacity="0.5"/>
  <circle cx="300" cy="50" r="2" fill="#FF6B35" opacity="0.6"/>
  <circle cx="900" cy="60" r="3" fill="#E50914" opacity="0.4"/>
  <circle cx="1100" cy="90" r="2" fill="#FF6B35" opacity="0.5"/>
  <circle cx="500" cy="30" r="2.5" fill="white" opacity="0.3"/>
  <circle cx="700" cy="40" r="2" fill="white" opacity="0.4"/>
  <circle cx="1200" cy="70" r="3" fill="#E50914" opacity="0.3"/>
  <!-- Glow line -->
  <rect x="0" y="195" width="1280" height="10" fill="url(#glow)"/>
  <!-- Film strip decoration left -->
  <rect x="0" y="0" width="80" height="400" fill="#000" opacity="0.4"/>
  <rect x="5" y="20" width="70" height="30" fill="none" stroke="#333" stroke-width="1"/>
  <rect x="5" y="70" width="70" height="30" fill="none" stroke="#333" stroke-width="1"/>
  <rect x="5" y="120" width="70" height="30" fill="none" stroke="#333" stroke-width="1"/>
  <rect x="5" y="170" width="70" height="30" fill="none" stroke="#333" stroke-width="1"/>
  <rect x="5" y="220" width="70" height="30" fill="none" stroke="#333" stroke-width="1"/>
  <rect x="5" y="270" width="70" height="30" fill="none" stroke="#333" stroke-width="1"/>
  <rect x="5" y="320" width="70" height="30" fill="none" stroke="#333" stroke-width="1"/>
  <rect x="5" y="370" width="70" height="30" fill="none" stroke="#333" stroke-width="1"/>
  <!-- Film strip decoration right -->
  <rect x="1200" y="0" width="80" height="400" fill="#000" opacity="0.4"/>
  <rect x="1205" y="20" width="70" height="30" fill="none" stroke="#333" stroke-width="1"/>
  <rect x="1205" y="70" width="70" height="30" fill="none" stroke="#333" stroke-width="1"/>
  <rect x="1205" y="120" width="70" height="30" fill="none" stroke="#333" stroke-width="1"/>
  <rect x="1205" y="170" width="70" height="30" fill="none" stroke="#333" stroke-width="1"/>
  <rect x="1205" y="220" width="70" height="30" fill="none" stroke="#333" stroke-width="1"/>
  <rect x="1205" y="270" width="70" height="30" fill="none" stroke="#333" stroke-width="1"/>
  <rect x="1205" y="320" width="70" height="30" fill="none" stroke="#333" stroke-width="1"/>
  <rect x="1205" y="370" width="70" height="30" fill="none" stroke="#333" stroke-width="1"/>
  <!-- Main title -->
  <text x="640" y="170" font-family="Impact, Arial Black, sans-serif" font-size="96" font-weight="bold" fill="#E50914" text-anchor="middle" letter-spacing="8">CINEPLEX</text>
  <text x="640" y="240" font-family="Impact, Arial Black, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="20">BOOK YOUR SEATS NOW</text>
  <text x="640" y="300" font-family="Arial, sans-serif" font-size="20" fill="#aaa" text-anchor="middle">Experience the magic of cinema like never before</text>
  <!-- Decorative line -->
  <line x1="300" y1="268" x2="540" y2="268" stroke="#E50914" stroke-width="2"/>
  <line x1="740" y1="268" x2="980" y2="268" stroke="#E50914" stroke-width="2"/>
</svg>
