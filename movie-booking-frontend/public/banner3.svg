<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7f0000;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#cc0000;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4a0000;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="topfade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="botfade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.7"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <!-- Top overlay -->
  <rect width="1280" height="200" fill="url(#topfade)"/>
  <!-- Bottom overlay -->
  <rect y="200" width="1280" height="200" fill="url(#botfade)"/>
  <!-- Abstract shapes for energy -->
  <polygon points="0,400 400,0 500,0 100,400" fill="white" opacity="0.04"/>
  <polygon points="780,0 1280,400 1280,300 1080,0" fill="white" opacity="0.04"/>
  <polygon points="500,0 900,0 700,400 300,400" fill="#ff4444" opacity="0.07"/>
  <!-- Diagonal lines pattern -->
  <line x1="0" y1="100" x2="400" y2="0" stroke="white" stroke-width="1" opacity="0.07"/>
  <line x1="0" y1="200" x2="600" y2="0" stroke="white" stroke-width="1" opacity="0.07"/>
  <line x1="0" y1="300" x2="800" y2="0" stroke="white" stroke-width="1" opacity="0.07"/>
  <line x1="0" y1="400" x2="1000" y2="0" stroke="white" stroke-width="1" opacity="0.07"/>
  <line x1="200" y1="400" x2="1200" y2="0" stroke="white" stroke-width="1" opacity="0.07"/>
  <line x1="400" y1="400" x2="1280" y2="60" stroke="white" stroke-width="1" opacity="0.07"/>
  <!-- Ticket icons suggested by rectangles -->
  <rect x="100" y="80" width="180" height="120" rx="10" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <circle cx="100" cy="140" r="15" fill="#cc0000"/>
  <circle cx="280" cy="140" r="15" fill="#cc0000"/>
  <rect x="1000" y="80" width="180" height="120" rx="10" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  <circle cx="1000" cy="140" r="15" fill="#cc0000"/>
  <circle cx="1180" cy="140" r="15" fill="#cc0000"/>
  <!-- Main text -->
  <text x="640" y="170" font-family="Impact, Arial Black, sans-serif" font-size="56" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="8">GET YOUR TICKETS</text>
  <text x="640" y="245" font-family="Impact, Arial Black, sans-serif" font-size="88" font-weight="bold" fill="#FFD700" text-anchor="middle" letter-spacing="4">BEFORE THEY'RE GONE</text>
  <text x="640" y="305" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.8)" text-anchor="middle">Fast. Easy. Secure. Book in seconds.</text>
  <!-- CTA bar -->
  <rect x="490" y="330" width="300" height="48" rx="24" fill="#FFD700"/>
  <text x="640" y="362" font-family="Arial Black, sans-serif" font-size="20" font-weight="bold" fill="#7f0000" text-anchor="middle">BOOK NOW →</text>
</svg>
