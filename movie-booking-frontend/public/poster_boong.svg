<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#302b63;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#24243e;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <!-- Stars background -->
  <circle cx="50" cy="50" r="2" fill="white" opacity="0.7"/>
  <circle cx="120" cy="30" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="300" cy="70" r="2" fill="white" opacity="0.8"/>
  <circle cx="360" cy="40" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="80" cy="120" r="1" fill="white" opacity="0.6"/>
  <circle cx="350" cy="150" r="2" fill="white" opacity="0.7"/>
  <circle cx="30" cy="200" r="1.5" fill="white" opacity="0.5"/>
  <!-- Cute monster/creature character -->
  <ellipse cx="200" cy="200" rx="75" ry="80" fill="#6A0DAD" opacity="0.9"/>
  <ellipse cx="200" cy="180" rx="55" ry="60" fill="#8B2FC9" opacity="0.9"/>
  <!-- Eyes -->
  <circle cx="180" cy="170" r="18" fill="white"/>
  <circle cx="220" cy="170" r="18" fill="white"/>
  <circle cx="183" cy="172" r="11" fill="#6A0DAD"/>
  <circle cx="223" cy="172" r="11" fill="#6A0DAD"/>
  <circle cx="186" cy="169" r="5" fill="white"/>
  <circle cx="226" cy="169" r="5" fill="white"/>
  <!-- Smile -->
  <path d="M175 195 Q200 215 225 195" stroke="white" stroke-width="3" fill="none"/>
  <!-- Ears/Horns -->
  <ellipse cx="145" cy="130" rx="15" ry="25" fill="#9B3FD9" transform="rotate(-20, 145, 130)"/>
  <ellipse cx="255" cy="130" rx="15" ry="25" fill="#9B3FD9" transform="rotate(20, 255, 130)"/>
  <!-- Body -->
  <ellipse cx="200" cy="310" rx="60" ry="70" fill="#7B1FA2" opacity="0.8"/>
  <!-- Tiny arms -->
  <ellipse cx="140" cy="300" rx="22" ry="12" fill="#8B2FC9" opacity="0.8" transform="rotate(-30, 140, 300)"/>
  <ellipse cx="260" cy="300" rx="22" ry="12" fill="#8B2FC9" opacity="0.8" transform="rotate(30, 260, 300)"/>
  <!-- Sparkles -->
  <text x="60" y="280" font-family="Arial" font-size="24" fill="#FFD700" opacity="0.8">✦</text>
  <text x="320" y="260" font-family="Arial" font-size="20" fill="#FF69B4" opacity="0.7">✦</text>
  <text x="100" y="350" font-family="Arial" font-size="16" fill="#00FFFF" opacity="0.6">✦</text>
  <!-- Overlay for bottom text area -->
  <rect x="0" y="400" width="400" height="200" fill="#0f0c29" opacity="0.85"/>
  <!-- Decorative border -->
  <rect x="8" y="8" width="384" height="584" fill="none" stroke="#9B3FD9" stroke-width="2" opacity="0.7"/>
  <!-- Title -->
  <text x="200" y="445" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="52" font-weight="bold" fill="#FF69B4" text-anchor="middle">BOONG</text>
  <text x="200" y="478" font-family="Arial, sans-serif" font-size="13" fill="#B39DDB" text-anchor="middle" letter-spacing="2">A MAGICAL ADVENTURE</text>
  <text x="200" y="510" font-family="Arial, sans-serif" font-size="12" fill="#CE93D8" text-anchor="middle">For the Young at Heart</text>
  <text x="200" y="548" font-family="Arial" font-size="18" fill="#FFD700" text-anchor="middle">★ ★ ★ ★</text>
  <text x="200" y="578" font-family="Arial" font-size="11" fill="#9B3FD9" text-anchor="middle">ANIMATED • FAMILY • 2025</text>
</svg>
