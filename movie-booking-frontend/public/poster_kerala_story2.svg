<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2137;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#1a4a6b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d2137;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d4f8c;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#062040;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <!-- Backwater / Kerala landscape -->
  <rect x="0" y="300" width="400" height="200" fill="url(#water)"/>
  <!-- Coconut trees -->
  <rect x="60" y="150" width="8" height="180" fill="#4A2F10" opacity="0.9"/>
  <ellipse cx="64" cy="145" rx="30" ry="20" fill="#1a6b1a" opacity="0.8"/>
  <ellipse cx="75" cy="130" rx="25" ry="18" fill="#228B22" opacity="0.8"/>
  <ellipse cx="50" cy="135" rx="22" ry="15" fill="#1a6b1a" opacity="0.7"/>
  <rect x="330" y="170" width="8" height="160" fill="#4A2F10" opacity="0.9"/>
  <ellipse cx="334" cy="165" rx="28" ry="18" fill="#228B22" opacity="0.8"/>
  <ellipse cx="344" cy="152" rx="22" ry="15" fill="#1a6b1a" opacity="0.8"/>
  <ellipse cx="322" cy="158" rx="20" ry="14" fill="#1a6b1a" opacity="0.7"/>
  <!-- Temple gopuram silhouette -->
  <polygon points="200,80 175,200 225,200" fill="#0d2137" opacity="0.9"/>
  <polygon points="200,100 185,180 215,180" fill="#1a4a6b" opacity="0.5"/>
  <rect x="170" y="200" width="60" height="100" fill="#0d2137" opacity="0.9"/>
  <!-- Moon/sun reflection in water -->
  <circle cx="200" cy="290" r="35" fill="#FFD700" opacity="0.15"/>
  <ellipse cx="200" cy="370" rx="30" ry="10" fill="#FFD700" opacity="0.1"/>
  <!-- Boat silhouette -->
  <path d="M130 340 Q200 330 270 340 L260 360 Q200 365 140 360 Z" fill="#0d2137" opacity="0.9"/>
  <!-- Oar -->
  <rect x="195" y="335" width="3" height="40" fill="#5D3A10" opacity="0.8"/>
  <!-- Overlay for bottom -->
  <rect x="0" y="400" width="400" height="200" fill="#050E1A" opacity="0.9"/>
  <!-- Decorative border with Kerala pattern -->
  <rect x="8" y="8" width="384" height="584" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.5"/>
  <rect x="15" y="15" width="370" height="570" fill="none" stroke="#FF6B00" stroke-width="1" opacity="0.3"/>
  <!-- Title -->
  <text x="200" y="437" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#FFD700" text-anchor="middle">Kerala Story</text>
  <text x="200" y="468" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="#FF6B00" text-anchor="middle">Chapter 2</text>
  <text x="200" y="497" font-family="Georgia, serif" font-size="12" fill="#B8C4CE" text-anchor="middle" letter-spacing="2">THE TRUTH UNFOLDS</text>
  <text x="200" y="535" font-family="Arial" font-size="18" fill="#FFD700" text-anchor="middle">★ ★ ★ ★</text>
  <text x="200" y="572" font-family="Arial" font-size="11" fill="#5D8FAA" text-anchor="middle">MALAYALAM • DRAMA • 2025</text>
</svg>
