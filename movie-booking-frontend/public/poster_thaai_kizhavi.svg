<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#D2691E;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F4A460;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect width="400" height="600" fill="url(#overlay)"/>
  <!-- Decorative flower motifs -->
  <circle cx="200" cy="80" r="50" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.5"/>
  <circle cx="200" cy="80" r="35" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.4"/>
  <!-- Kolam Pattern -->
  <path d="M180 80 Q200 50 220 80 Q200 110 180 80" fill="#FFD700" opacity="0.3"/>
  <path d="M170 55 Q200 40 230 55 Q200 95 170 55" fill="none" stroke="#FFA500" stroke-width="1.5" opacity="0.5"/>
  <!-- Silhouette of elderly woman -->
  <ellipse cx="200" cy="200" rx="45" ry="55" fill="#3D1C02" opacity="0.7"/>
  <ellipse cx="200" cy="160" rx="28" ry="30" fill="#2A1200" opacity="0.8"/>
  <!-- Saree drape suggestion -->
  <path d="M155 240 Q200 220 245 240 L250 350 Q200 370 150 350 Z" fill="#5D2E0C" opacity="0.6"/>
  <!-- Decorative border -->
  <rect x="10" y="10" width="380" height="580" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.4"/>
  <rect x="18" y="18" width="364" height="564" fill="none" stroke="#FFA500" stroke-width="1" opacity="0.3"/>
  <!-- Title -->
  <text x="200" y="430" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#FFD700" text-anchor="middle">Thaai Kizhavi</text>
  <text x="200" y="465" font-family="Georgia, serif" font-size="15" fill="#FFA500" text-anchor="middle">தாய் கிழவி</text>
  <!-- Tagline -->
  <text x="200" y="500" font-family="Georgia, serif" font-size="13" fill="#F4C868" text-anchor="middle">A Story of Love &amp; Life</text>
  <!-- Stars -->
  <text x="200" y="540" font-family="Arial" font-size="18" fill="#FFD700" text-anchor="middle">★ ★ ★ ★</text>
  <!-- Year -->
  <text x="200" y="575" font-family="Arial" font-size="12" fill="#D4A96A" text-anchor="middle">2025 | TAMIL DRAMA</text>
</svg>
