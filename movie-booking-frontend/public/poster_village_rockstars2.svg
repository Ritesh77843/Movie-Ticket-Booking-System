<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a6b1a;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#2e8b2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7BC67B;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="60%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.85"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <!-- Rolling hills background -->
  <ellipse cx="150" cy="350" rx="200" ry="120" fill="#1a5c1a" opacity="0.6"/>
  <ellipse cx="320" cy="380" rx="180" ry="100" fill="#155c15" opacity="0.5"/>
  <!-- Village huts -->
  <rect x="70" y="300" width="60" height="50" fill="#8B4513" opacity="0.7"/>
  <polygon points="60,300 100,260 140,300" fill="#A0522D" opacity="0.8"/>
  <rect x="260" y="310" width="55" height="45" fill="#8B4513" opacity="0.7"/>
  <polygon points="250,310 287,272 325,310" fill="#A0522D" opacity="0.8"/>
  <!-- Young girl with guitar silhouette -->
  <ellipse cx="200" cy="220" rx="22" ry="24" fill="#0A2A0A" opacity="0.85"/>
  <rect x="185" y="242" width="30" height="65" fill="#0A2A0A" opacity="0.8"/>
  <!-- Guitar shape -->
  <ellipse cx="235" cy="275" rx="18" ry="22" fill="#0A2A0A" opacity="0.8"/>
  <ellipse cx="235" cy="245" rx="12" ry="14" fill="#0A2A0A" opacity="0.8"/>
  <rect x="233" y="232" width="4" height="60" fill="#0A2A0A" opacity="0.8"/>
  <rect x="226" y="239" width="18" height="3" fill="#1a5c1a" opacity="0.8"/>
  <!-- Sunrays -->
  <circle cx="200" cy="100" r="55" fill="#FFE566" opacity="0.3"/>
  <circle cx="200" cy="100" r="38" fill="#FFD700" opacity="0.4"/>
  <!-- Overlay -->
  <rect width="400" height="600" fill="url(#overlay)"/>
  <!-- Decorative border -->
  <rect x="8" y="8" width="384" height="584" fill="none" stroke="#7BC67B" stroke-width="2" opacity="0.6"/>
  <!-- Musical notes scattered -->
  <text x="60" y="180" font-family="Arial" font-size="22" fill="#FFD700" opacity="0.5">♪</text>
  <text x="310" y="150" font-family="Arial" font-size="28" fill="#FFD700" opacity="0.5">♫</text>
  <text x="330" y="240" font-family="Arial" font-size="20" fill="#FFD700" opacity="0.4">♩</text>
  <!-- Title -->
  <text x="200" y="425" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#7BC67B" text-anchor="middle">Village Rockstars 2</text>
  <text x="200" y="460" font-family="Georgia, serif" font-size="14" fill="#B5E8B5" text-anchor="middle">গাঁৱৰ ৰক্‌ষ্টাৰ ২</text>
  <text x="200" y="495" font-family="Georgia, serif" font-size="12" fill="#90D190" text-anchor="middle">Dreams Have No Boundaries</text>
  <text x="200" y="535" font-family="Arial" font-size="18" fill="#FFD700" text-anchor="middle">★ ★ ★ ★</text>
  <text x="200" y="572" font-family="Arial" font-size="11" fill="#7BC67B" text-anchor="middle">ASSAMESE • FEEL-GOOD • 2025</text>
</svg>
